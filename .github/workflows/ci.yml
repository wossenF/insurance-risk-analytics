name: CI Pipeline

on:
  push:
    branches:
      - main
      - task-1

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Linting
        run: |
          flake8 src/

      - name: Run Tests
        run: |
          pytest